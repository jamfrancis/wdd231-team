<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Weather App</title>
    <link rel="stylesheet" href="css/color-pallete-and-fonts.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="simplified-header">
        <a href="/" class="logo-link">
            <img class="logo" src="assets/logo.png" alt="logo" width="5%">
        </a>
        <div class="input">
            <form class="search-container" id="searchForm">
                <input type="text" id="searchInput" placeholder="Enter city name or zip code" required autocomplete="off">
                <button type="submit" aria-label="Search">
                    <span class="search-arrow">→</span>
                </button>
            </form>
        </div>
    </header>

    <main class="contact-main">
        <h1>Contact Us</h1>
        <form id="feedback-form" action="success.html" method="get">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="feedback-type">Feedback Type:</label>
                <select id="feedback-type" name="feedback-type" required>
                    <option value="">Select a type</option>
                    <option value="weather-accuracy">Weather Accuracy</option>
                    <option value="feature-request">Feature Request</option>
                    <option value="bug-report">Bug Report</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="submit-button">Submit Feedback</button>
        </form>
    </main>

    <footer>
        <div class="footer-content">
            <p class="copyright">© 2025 Hazelwood & Francis</p>
            <a class="contact-link" href="contact.html" aria-label="Contact us">Contact us</a>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
